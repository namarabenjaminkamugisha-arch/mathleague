<!doctype html>
<html><head><meta charset="utf-8"><title>MathLeague icon check</title>
<style>
  body{background:#05070a;color:#e7eef6;font:14px -apple-system,Segoe UI,Inter,sans-serif;padding:32px}
  h1{font-size:18px;font-weight:600;letter-spacing:-.3px}
  .row{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin:28px 0;padding:24px;background:#0b1016;border-radius:16px}
  figure{margin:0;text-align:center}
  figcaption{margin-top:10px;font-size:11px;color:#7d8ea0}
  img{display:block;image-rendering:auto}
  .light{background:#f5f7fa}
  .light figcaption{color:#55606d}
  .strip{display:flex;align-items:center;gap:10px;background:#151b22;padding:8px 14px;border-radius:8px}
  .strip img{width:16px;height:16px}
  .strip span{font-size:12px;color:#c8d4e0}
</style></head><body>
<h1>MathLeague — icon at every shipped size</h1>

<div class="row">
  <figure><img src="../src/icons/icon-512.png" width="256"><figcaption>512 (shown 256)</figcaption></figure>
  <figure><img src="../src/icons/icon-128.png"><figcaption>128</figcaption></figure>
  <figure><img src="../src/icons/icon-64.png"><figcaption>64</figcaption></figure>
  <figure><img src="../src/icons/icon-48.png"><figcaption>48</figcaption></figure>
  <figure><img src="../src/icons/icon-32.png"><figcaption>32</figcaption></figure>
  <figure><img src="../src/icons/icon-16.png"><figcaption>16</figcaption></figure>
</div>

<div class="row">
  <figure><img src="../src/icons/maskable-512.png" width="192"><figcaption>maskable 512</figcaption></figure>
  <figure><img src="../src/icons/apple-touch-icon.png" width="180"><figcaption>apple touch 180</figcaption></figure>
  <figure><img src="../src/icons/icon.svg" width="180"><figcaption>icon.svg (vector)</figcaption></figure>
</div>

<div class="row light">
  <figure><img src="../src/icons/icon-128.png"><figcaption>128 on light</figcaption></figure>
  <figure><img src="../src/icons/icon-32.png"><figcaption>32 on light</figcaption></figure>
</div>

<div class="row">
  <div class="strip"><img src="../src/icons/icon-16.png"><span>MathLeague — browser tab test</span></div>
</div>

<div class="row">
  <figure><img src="../src/icons/splash.svg" width="220"><figcaption>splash</figcaption></figure>
</div>
</body></html>
